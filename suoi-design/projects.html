<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án | SuoiDesign</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo" style="margin-bottom: 2rem;">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="8" fill="#004F2D"/>
                    <path d="M10 10L22 22M22 10L10 22" stroke="#F4E87C" stroke-width="3" stroke-linecap="round"/>
                </svg>
                SuoiDesign
            </a>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Tổng quan</a>
                <a href="studio.html" class="nav-item"><i class="fas fa-magic"></i> AI Studio</a>
                <a href="social.html" class="nav-item"><i class="fas fa-share-nodes"></i> Tự động hóa</a>
                <a href="writer.html" class="nav-item"><i class="fas fa-pen-nib"></i> AI Writer</a>
                <a href="projects.html" class="nav-item active"><i class="fas fa-folder"></i> Dự án</a>
                <a href="assets.html" class="nav-item"><i class="fas fa-database"></i> Tài sản</a>
                <div style="margin-top: auto;">
                    <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Cài đặt</a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; width: 100%;">
                <div>
                    <h2 style="font-size: 1.8rem;">Dự án của tôi</h2>
                    <p style="color: var(--text-muted);">Quản lý các chiến dịch sáng tạo của bạn.</p>
                </div>
                <button class="btn btn-accent"><i class="fas fa-plus mr-2"></i> Dự án mới</button>
            </header>

            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem;">
                <div class="card-glass" style="padding: 1.5rem; cursor: pointer; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
                    <div style="width: 100%; height: 150px; background: rgba(0,79,45,0.2); border-radius: 1rem; margin-bottom: 1.2rem; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-leaf" style="font-size: 3rem; color: var(--accent);"></i>
                    </div>
                    <h3>Chiến dịch Bình hoa</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">12 tài sản • 3 video • Đang chạy</p>
                    <div style="display: flex; -webkit-mask-image: linear-gradient(to right, black 80%, transparent);">
                        <img src="https://ui-avatars.com/api/?name=A&background=random" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-main);">
                        <img src="https://ui-avatars.com/api/?name=B&background=random" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-main); margin-left: -8px;">
                    </div>
                </div>

                <div class="card-glass" style="padding: 1.5rem; cursor: pointer; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'">
                    <div style="width: 100%; height: 150px; background: rgba(244,232,124,0.1); border-radius: 1rem; margin-bottom: 1.2rem; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-tshirt" style="font-size: 3rem; color: var(--accent);"></i>
                    </div>
                    <h3>BST Áo thun Hè</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">8 tài sản • 1 video • Đã xong</p>
                    <div style="display: flex;">
                        <img src="https://ui-avatars.com/api/?name=C&background=random" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-main);">
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
