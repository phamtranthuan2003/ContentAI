<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt | SuoiDesign</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo" style="margin-bottom: 2rem;">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="8" fill="#004F2D"/>
                    <path d="M10 10L22 22M22 10L10 22" stroke="#F4E87C" stroke-width="3" stroke-linecap="round"/>
                </svg>
                SuoiDesign
            </a>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Tổng quan</a>
                <a href="studio.html" class="nav-item"><i class="fas fa-magic"></i> AI Studio</a>
                <a href="social.html" class="nav-item"><i class="fas fa-share-nodes"></i> Tự động hóa</a>
                <a href="writer.html" class="nav-item"><i class="fas fa-pen-nib"></i> AI Writer</a>
                <a href="projects.html" class="nav-item"><i class="fas fa-folder"></i> Dự án</a>
                <a href="assets.html" class="nav-item"><i class="fas fa-database"></i> Tài sản</a>
                <div style="margin-top: auto;">
                    <a href="settings.html" class="nav-item active"><i class="fas fa-cog"></i> Cài đặt</a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header" style="margin-bottom: 2.5rem; width: 100%;">
                <h2 style="font-size: 1.8rem;">Cài đặt hệ thống</h2>
                <p style="color: var(--text-muted);">Quản lý tài khoản và cấu hình AI của bạn.</p>
            </header>

            <div style="max-width: 800px;">
                <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                    <h3 style="font-size: 1.1rem; margin-bottom: 2rem;">Thông tin cá nhân</h3>
                    <div style="display: flex; gap: 2rem; align-items: center; margin-bottom: 2rem;">
                        <img src="https://ui-avatars.com/api/?name=S+D&background=004F2D&color=F4E87C" style="width: 80px; height: 80px; border-radius: 50%;">
                        <button class="btn btn-outline">Thay đổi ảnh đại diện</button>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div>
                            <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Họ và tên</label>
                            <input type="text" class="card-glass" style="width: 100%; padding: 0.8rem; border: 1px solid var(--glass-border); border-radius: 0.8rem; color: #fff;" value="SuoiDesign User">
                        </div>
                        <div>
                            <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Email</label>
                            <input type="email" class="card-glass" style="width: 100%; padding: 0.8rem; border: 1px solid var(--glass-border); border-radius: 0.8rem; color: #fff;" value="user@suoidesign.com">
                        </div>
                    </div>
                    <button class="btn btn-primary" style="margin-top: 2rem;">Lưu thay đổi</button>
                </div>

                <div class="card" style="padding: 2rem;">
                    <h3 style="font-size: 1.1rem; margin-bottom: 2rem;">Kết nối API & AI</h3>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">OpenAI API Key</label>
                        <input type="password" class="card-glass" style="width: 100%; padding: 0.8rem; border: 1px solid var(--glass-border); border-radius: 0.8rem; color: #fff;" value="sk-••••••••••••••••">
                    </div>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Sử dụng Key riêng của bạn để tăng tốc độ xử lý hoặc dùng mặc định của hệ thống.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
