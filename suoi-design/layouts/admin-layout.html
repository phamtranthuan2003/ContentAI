<!-- Admin Layout Template - Thymeleaf -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.nz.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Bảng điều khiển | SuoiDesign'">Bảng điều khiển | SuoiDesign</title>
    <link rel="stylesheet" th:href="@{/assets/style.css}" href="../assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a th:href="@{/}" class="logo" style="margin-bottom: 2rem;">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="8" fill="#004F2D"/>
                    <path d="M10 10L22 22M22 10L10 22" stroke="#F4E87C" stroke-width="3" stroke-linecap="round"/>
                </svg>
                SuoiDesign
            </a>
            <nav class="sidebar-nav">
                <a th:href="@{/admin/dashboard}" class="nav-item"><i class="fas fa-th-large"></i> Tổng quan</a>
                <a th:href="@{/admin/admin}" class="nav-item"><i class="fas fa-user-shield"></i> Quản trị</a>
                <a th:href="@{/admin/studio}" class="nav-item"><i class="fas fa-magic"></i> AI Studio</a>
                <a th:href="@{/admin/social}" class="nav-item"><i class="fas fa-share-nodes"></i> Tự động hóa</a>
                <a th:href="@{/admin/writer}" class="nav-item"><i class="fas fa-pen-nib"></i> AI Writer</a>
                <a th:href="@{/admin/projects}" class="nav-item"><i class="fas fa-folder"></i> Dự án</a>
                <a th:href="@{/admin/assets}" class="nav-item"><i class="fas fa-database"></i> Tài sản</a>
                <div class="sidebar-bottom">
                    <div id="theme-toggle" class="theme-toggle-container">
                        <span style="font-size: 0.9rem; font-weight: 600;">Chế độ màu</span>
                        <i class="fas fa-sun"></i>
                    </div>
                    <a th:href="@{/admin/settings}" class="nav-item"><i class="fas fa-cog"></i> Cài đặt</a>
                    <a th:href="@{/login}" class="nav-item" style="color: #f87171;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </nav>
        </aside>

        <!-- Main Workspace - Dynamic content -->
        <main class="main-content" layout:fragment="content">
            <!-- Page content will be injected here -->
        </main>
    </div>
    <script th:src="@{/assets/script.js}" src="../assets/script.js"></script>
</body>
</html>
